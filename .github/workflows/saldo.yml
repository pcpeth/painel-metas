name: Atualizar saldo (Open Finance)

on:
  schedule:
    - cron: "17 10 * * *"   # ~07h17 de Brasília
    - cron: "17 22 * * *"   # ~19h17 de Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      enviar_email:
        description: "Enviar o resumo por e-mail agora"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  saldo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests firebase-admin
      - name: Ler saldo e gravar no Firebase
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ROBO_DEBUG: '1'
          RESUMO_FORCAR: ${{ inputs.enviar_email && '1' || '' }}
        run: python scripts/atualizar_saldo.py
